<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#75c0e7" />
      <stop offset="100%" stop-color="#2a87bd" />
    </linearGradient>
  </defs>
  <!-- Diamond shape -->
  <polygon points="50,0 100,50 50,100 0,50" fill="url(#diamond-grad)" />
  <!-- White Circle Outline -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="5" />
  <!-- Centered bold text 'acm' -->
  <text x="50" y="56" font-family="'Inter', 'Manrope', system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle">acm</text>
</svg>
